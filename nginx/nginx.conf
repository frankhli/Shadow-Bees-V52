# Shadow-Bees Nginx 生产配置
# 使用方法：复制到服务器 /etc/nginx/nginx.conf

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    '$request_time $upstream_response_time';

    access_log /var/log/nginx/access.log main;

    # 基础优化
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # 限制请求体大小
    client_max_body_size 10M;

    # 限流配置
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

    # 上游服务器（Java后端）
    upstream backend {
        least_conn;
        server 127.0.0.1:8080 max_fails=3 fail_timeout=30s;
        # server 127.0.0.1:8081 max_fails=3 fail_timeout=30s;  # 多实例时启用
        keepalive 32;
    }

    # ==========================================
    # HTTP 重定向到 HTTPS
    # ==========================================
    server {
        listen 80;
        server_name api.shadowbees.com;
        return 301 https://$server_name$request_uri;
    }

    # ==========================================
    # HTTPS 主配置
    # ==========================================
    server {
        listen 443 ssl http2;
        server_name api.shadowbeees.com;

        # SSL 证书（Let's Encrypt 免费证书）
        ssl_certificate /etc/letsencrypt/live/api.shadowbees.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.shadowbees.com/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/api.shadowbees.com/chain.pem;

        # SSL 优化
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # HSTS
        add_header Strict-Transport-Security "max-age=63072000" always;

        # 安全响应头
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # 静态文件缓存（前端构建文件）
        location / {
            root /var/www/shadow-bees/dist;
            index index.html;
            try_files $uri $uri/ /index.html;

            # HTML 不缓存
            location ~* \.html$ {
                expires -1;
                add_header Cache-Control "no-store, no-cache, must-revalidate";
            }

            # JS/CSS 长期缓存
            location ~* \.(js|css)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }

            # 图片字体缓存
            location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2)$ {
                expires 6M;
                add_header Cache-Control "public";
            }
        }

        # API 代理
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # 错误处理
            proxy_intercept_errors on;
            error_page 502 503 504 /50x.html;
        }

        # WebSocket 支持
        location /ws {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 健康检查
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # 错误页面
        location = /50x.html {
            root /var/www/shadow-bees/error;
            internal;
        }

        # 禁止访问敏感文件
        location ~ /\. {
            deny all;
        }

        location ~ \.(git|svn|hg) {
            deny all;
        }
    }
}
