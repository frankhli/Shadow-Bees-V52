# Flyway 数据库迁移配置

# 数据库连接
flyway.url=jdbc:postgresql://localhost:5432/shadowbees
flyway.user=sb_admin
flyway.password=shadowbees123

# 迁移脚本位置
flyway.locations=filesystem:sql/migrations

# 基础信息
flyway.schemas=public
flyway.defaultSchema=public
flyway.table=flyway_schema_history

# 迁移策略
flyway.cleanDisabled=false
flyway.baselineOnMigrate=true
flyway.baselineVersion=1

# 验证
flyway.validateOnMigrate=true
flyway.outOfOrder=false

# 输出
flyway.placeholderReplacement=true

# 占位符
flyway.placeholders.appUser=sb_app
flyway.placeholders.appPassword=app_password
