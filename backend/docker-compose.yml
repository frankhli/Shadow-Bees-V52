# ==========================================
# 数据卷
# ==========================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ==========================================
# 网络
# ==========================================
networks:
  sb-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
