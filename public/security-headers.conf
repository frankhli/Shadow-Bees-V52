# Nginx 安全响应头配置
# 复制到 nginx/conf.d/security-headers.conf

# 内容安全策略 (CSP) - 防止XSS攻击
add_header Content-Security-Policy "
  default-src 'self';
  script-src 'self' 'unsafe-inline' 'unsafe-eval' https://browser.sentry-cdn.com https://hm.baidu.com https://www.googletagmanager.com;
  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
  font-src 'self' https://fonts.gstatic.com data:;
  img-src 'self' data: https: blob:;
  connect-src 'self' https://api.shadowbees.com https://sentry.io https://*.sentry.io https://hm.baidu.com https://www.google-analytics.com;
  media-src 'self';
  object-src 'none';
  frame-ancestors 'self';
  base-uri 'self';
  form-action 'self';
" always;

# 防止点击劫持
add_header X-Frame-Options "SAMEORIGIN" always;

# 防止MIME类型嗅探
add_header X-Content-Type-Options "nosniff" always;

# XSS保护（浏览器内置）
add_header X-XSS-Protection "1; mode=block" always;

# 引用策略
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# 权限策略（控制浏览器API）
add_header Permissions-Policy "
  camera=(),
  microphone=(),
  geolocation=(self),
  payment=(),
  usb=(),
  magnetometer=(),
  gyroscope=(),
  accelerometer=()
" always;

# HSTS (HTTPS严格传输安全)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# 移除服务器标识
server_tokens off;

# 隐藏Nginx版本
more_clear_headers Server X-Powered-By X-AspNet-Version X-AspNetMvc-Version;
